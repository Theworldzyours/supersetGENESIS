# Render Blueprint for Apache Superset
# Deploy using: render blueprint apply
# Docs: https://render.com/docs/blueprint-spec

services:
  # Main Superset web service
  - type: web
    name: superset
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    dockerCommand: ""
    healthCheckPath: /health
    envVars:
      # Required: Generate a strong secret key
      # Use: openssl rand -base64 42
      - key: SUPERSET_SECRET_KEY
        generateValue: true
      # Database connection - uses the attached PostgreSQL
      - key: SUPERSET__SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: superset-db
          property: connectionString
      # Production settings
      - key: SUPERSET_ENV
        value: production
      - key: SUPERSET_PORT
        value: "8088"
      # Scaled for Standard plan (4 CPU / 4GB RAM)
      - key: SERVER_WORKER_AMOUNT
        value: "4"
      - key: SERVER_THREADS_AMOUNT
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "120"
    # Persistent disk for uploads/cache
    disk:
      name: superset-data
      mountPath: /app/superset_home
      sizeGB: 10

databases:
  # PostgreSQL database for Superset metadata - production tier
  - name: superset-db
    plan: standard
    databaseName: superset
    user: superset
