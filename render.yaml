# Render Blueprint for Apache Superset
# Uses pre-built image from GitHub Container Registry (no build on Render)
# Image is built by GitHub Actions on push to master
# Docs: https://render.com/docs/blueprint-spec

services:
  # Main Superset web service - pulls pre-built image
  - type: web
    name: superset
    runtime: image
    image:
      url: ghcr.io/theworldzyours/supersetgenesis:latest
    plan: starter
    healthCheckPath: /health
    envVars:
      # Required: Generate a strong secret key
      - key: SUPERSET_SECRET_KEY
        generateValue: true
      # Database connection - uses the attached PostgreSQL
      - key: SUPERSET__SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: superset-db
          property: connectionString
      # Production settings
      - key: SUPERSET_ENV
        value: production
      - key: SUPERSET_PORT
        value: "8088"
      # Workers for Starter plan
      - key: SERVER_WORKER_AMOUNT
        value: "2"
      - key: SERVER_THREADS_AMOUNT
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "120"
    # Persistent disk for uploads/cache
    disk:
      name: superset-data
      mountPath: /app/superset_home
      sizeGB: 1

databases:
  # PostgreSQL database for Superset metadata
  - name: superset-db
    plan: basic-256mb
    databaseName: superset
    user: superset
